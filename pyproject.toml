[project]
name = "robotics-visionai-example"
version = "0.7.0"
description = "Vision AI web viewer for the NXP MR-NavQ95 board"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
robotics-visionai-example = "robotics_visionai_example:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotics_visionai_example = ["README.md", "app/ui/*.html"]

[tool.uv]
